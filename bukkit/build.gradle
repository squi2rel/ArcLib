plugins {
    id 'java-library'
    id 'com.gradleup.shadow' version '9.4.3'
}
group = 'com.github.squi2rel.arclib'
version = '1.0.0'
base { archivesName = 'arclib-bukkit' }
repositories {
    mavenCentral()
    maven { url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
}
dependencies {
    compileOnly 'org.spigotmc:spigot-api:1.20.1-R0.1-SNAPSHOT'
    compileOnly 'org.slf4j:slf4j-api:2.0.17'
    implementation 'com.github.squi2rel.arclib:arclib-common:1.0.0'
}
java { toolchain.languageVersion = JavaLanguageVersion.of(17); withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.release = 17; options.encoding = 'UTF-8' }
processResources {
    inputs.property 'version', project.version;
    filesMatching('plugin.yml') { expand version: project.version }
}
tasks.named('jar') { archiveClassifier = 'thin' }
tasks.named('shadowJar') {
    archiveClassifier = ''
    from('../LICENSE') { rename { 'LICENSE_arclib' } }
    mergeServiceFiles()
}
tasks.named('assemble') { dependsOn tasks.named('shadowJar') }

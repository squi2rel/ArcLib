pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.architectury.dev/' }
        maven { url = 'https://maven.neoforged.net/releases/' }
        gradlePluginPortal()
    }
}

rootProject.name = 'arclib-1.21.1'

includeBuild('../common') {
    name = 'arclib-common-build'
    dependencySubstitution {
        substitute module('com.github.squi2rel.arclib:arclib-common') using project(':')
    }
}

include 'bridge'
include 'fabric'
include 'neoforge'

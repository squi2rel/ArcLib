plugins {
    id 'base'
    id 'net.fabricmc.fabric-loom' version '1.17.17' apply false
    id 'net.neoforged.moddev' version '2.0.148' apply false
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'
    base { archivesName = "${rootProject.archives_name}-${rootProject.minecraft_version}-${project.name}" }
    repositories { mavenCentral() }
    java {
        toolchain.languageVersion = JavaLanguageVersion.of(25)
        withSourcesJar()
        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
    }
    tasks.withType(JavaCompile).configureEach {
        options.release = 25
        options.encoding = 'UTF-8'
    }
    tasks.named('jar') {
        from(rootProject.file('../LICENSE')) { rename { "LICENSE_${rootProject.archives_name}" } }
    }
}

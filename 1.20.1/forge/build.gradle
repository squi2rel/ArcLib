plugins { id 'com.gradleup.shadow' }

architectury { platformSetupLoomIde(); forge() }
repositories { maven { url = 'https://maven.minecraftforge.net/' } }
loom { forge { mixinConfig 'arclib.mixins.json' } }
jar { manifest { attributes 'MixinConfigs': 'arclib.mixins.json' } }
dependencies {
    forge "net.minecraftforge:forge:$rootProject.forge_version"
    implementation "org.mozilla:rhino:$rootProject.rhino_version"
    forgeRuntimeLibrary "org.mozilla:rhino:$rootProject.rhino_version"
    include "org.mozilla:rhino:$rootProject.rhino_version"
}
apply from: rootProject.file('../gradle/loader-packaging.gradle')

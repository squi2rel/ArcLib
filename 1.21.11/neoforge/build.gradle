plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

apply from: rootProject.file('../gradle/neoforge-development.gradle')

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    implementation "com.github.squi2rel.arclib:arclib-common:$rootProject.common_version"
    implementation "org.mozilla:rhino:$rootProject.rhino_version"
    forgeRuntimeLibrary "org.mozilla:rhino:$rootProject.rhino_version"
    include "org.mozilla:rhino:$rootProject.rhino_version"
    shadowBundle project(path: ':bridge', configuration: 'transformProductionNeoForge')
    shadowBundle("com.github.squi2rel.arclib:arclib-common:$rootProject.common_version") { transitive = false }
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
